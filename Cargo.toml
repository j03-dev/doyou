[package]
name = "doyou"
version = "0.1.0"
authors = ["FITAHIANA Nomeniavo Joe <24nomeniavo@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
#
[workspace]
members = ["yt"]

[workspace.dependencies]
serde_json = "1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
serde_json.workspace = true
reqwest.workspace = true
serde.workspace = true
yt = { path = "yt", version = "0.0.1" }
ndk-context = "0.1.1"
jni = "0.22.4"
rusql-alchemy = { path = "../rusql-alchemy/rusql-alchemy", features = [
  "turso",
] }
tokio = "1.49.0"
directories = "6.0.0"

[features]
default = ["mobile"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
