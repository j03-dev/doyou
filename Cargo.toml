[package]
name = "doyou"
version = "0.1.0"
authors = ["FITAHIANA Nomeniavo Joe <24nomeniavo@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
#
[workspace]
members = ["media", "yt"]

[workspace.dependencies]
serde_json = "1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
doyou-media = { path = "media" }

[dependencies.rusql-alchemy]
path  = "../rusql-alchemy/rusql-alchemy"
features = ["turso"]

[dependencies.yt]
path = "yt"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
serde_json.workspace = true
reqwest.workspace = true
serde.workspace = true
ndk-context = "0.1.1"
jni = "0.22.4"
tokio = { version = "1.49.0", features = ["sync"] }
directories = "6.0.0"
walkdir = "2"
percent-encoding = "2"
lofty = "0.25"
tiny_http = "0.12"
doyou-media.workspace = true

[features]
default = ["mobile"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
